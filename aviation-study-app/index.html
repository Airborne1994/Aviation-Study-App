<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Aviation Study App – Flashcards, quizzes, and progress tracking for pilots and students">
  <meta name="theme-color" content="#0f172a">
  
  <!-- PWA / iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AvStudy">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <link rel="manifest" href="manifest.json">
  
  <title>Aviation Study App</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app" id="app">
    <!-- Header -->
    <header class="header" id="header">
      <div class="header-inner">
        <button class="back-btn" id="backBtn" hidden aria-label="Back">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>
        <h1 class="header-title" id="headerTitle">Aviation Study</h1>
        <div class="header-spacer"></div>
      </div>
    </header>

    <!-- Main content area -->
    <main class="main" id="main">
      <!-- HOME VIEW -->
      <section class="view" id="view-home">
        <div class="hero">
          <div class="hero-icon">✈</div>
          <h2>Ready for takeoff?</h2>
          <p>Master aviation knowledge with flashcards and quizzes.</p>
        </div>

        <div class="stats-row" id="homeStats">
          <div class="stat-card">
            <div class="stat-value" id="statStudied">0</div>
            <div class="stat-label">Cards Studied</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="statQuizzes">0</div>
            <div class="stat-label">Quizzes Taken</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="statBest">—</div>
            <div class="stat-label">Best Score</div>
          </div>
        </div>

        <div class="action-grid">
          <button class="action-card" data-nav="categories">
            <span class="action-icon">📚</span>
            <span class="action-title">Study Topics</span>
            <span class="action-desc">Browse categories</span>
          </button>
          <button class="action-card" data-nav="flashcards">
            <span class="action-icon">🃏</span>
            <span class="action-title">Flashcards</span>
            <span class="action-desc">All categories</span>
          </button>
          <button class="action-card" data-nav="quiz">
            <span class="action-icon">✅</span>
            <span class="action-title">Take a Quiz</span>
            <span class="action-desc">Test your knowledge</span>
          </button>
          <button class="action-card" data-nav="progress">
            <span class="action-icon">📊</span>
            <span class="action-title">Progress</span>
            <span class="action-desc">Your study stats</span>
          </button>
        </div>
      </section>

      <!-- CATEGORIES VIEW -->
      <section class="view" id="view-categories" hidden>
        <div class="category-list" id="categoryList"></div>
      </section>

      <!-- FLASHCARDS VIEW -->
      <section class="view" id="view-flashcards" hidden>
        <div class="flashcard-controls">
          <select id="flashCategory" class="select">
            <option value="all">All Categories</option>
          </select>
          <div class="flash-progress">
            <span id="flashCounter">1 / 1</span>
          </div>
        </div>

        <div class="flashcard-container">
          <div class="flashcard" id="flashcard">
            <div class="flashcard-inner">
              <div class="flashcard-front">
                <div class="card-label">Question</div>
                <div class="card-text" id="flashQuestion"></div>
                <div class="card-hint">Tap to flip</div>
              </div>
              <div class="flashcard-back">
                <div class="card-label">Answer</div>
                <div class="card-text" id="flashAnswer"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="flash-actions">
          <button class="btn btn-secondary" id="prevCard">Previous</button>
          <button class="btn btn-primary" id="nextCard">Next</button>
        </div>
        <div class="flash-actions secondary">
          <button class="btn btn-ghost" id="shuffleCards">Shuffle</button>
          <button class="btn btn-ghost" id="markKnown">Mark Known</button>
        </div>
      </section>

      <!-- QUIZ VIEW -->
      <section class="view" id="view-quiz" hidden>
        <div class="quiz-setup" id="quizSetup">
          <h3>Quiz Settings</h3>
          <label class="field">
            <span>Category</span>
            <select id="quizCategory" class="select"></select>
          </label>
          <label class="field">
            <span>Number of Questions</span>
            <select id="quizCount" class="select">
              <option value="5">5</option>
              <option value="10" selected>10</option>
              <option value="15">15</option>
              <option value="20">20</option>
            </select>
          </label>
          <button class="btn btn-primary btn-block" id="startQuiz">Start Quiz</button>
        </div>

        <div class="quiz-active" id="quizActive" hidden>
          <div class="quiz-header">
            <div class="quiz-progress-bar">
              <div class="quiz-progress-fill" id="quizProgressFill"></div>
            </div>
            <div class="quiz-meta">
              <span id="quizQuestionNum">1 / 10</span>
              <span id="quizScoreLive">Score: 0</span>
            </div>
          </div>
          <div class="quiz-question" id="quizQuestion"></div>
          <div class="quiz-options" id="quizOptions"></div>
          <button class="btn btn-primary btn-block" id="nextQuestion" hidden>Next Question</button>
        </div>

        <div class="quiz-results" id="quizResults" hidden>
          <div class="results-card">
            <div class="results-score" id="resultsScore">0%</div>
            <div class="results-detail" id="resultsDetail"></div>
            <button class="btn btn-primary btn-block" id="retryQuiz">Try Again</button>
            <button class="btn btn-secondary btn-block" id="backFromResults">Back to Home</button>
          </div>
        </div>
      </section>

      <!-- PROGRESS VIEW -->
      <section class="view" id="view-progress" hidden>
        <div class="progress-summary">
          <div class="stat-card large">
            <div class="stat-value" id="progStudied">0</div>
            <div class="stat-label">Total Cards Reviewed</div>
          </div>
          <div class="stat-card large">
            <div class="stat-value" id="progQuizzes">0</div>
            <div class="stat-label">Quizzes Completed</div>
          </div>
          <div class="stat-card large">
            <div class="stat-value" id="progBest">—</div>
            <div class="stat-label">Best Quiz Score</div>
          </div>
        </div>
        <div class="progress-actions">
          <button class="btn btn-ghost btn-block" id="resetProgress">Reset All Progress</button>
        </div>
      </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" id="bottomNav">
      <button class="nav-item active" data-nav="home">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Home</span>
      </button>
      <button class="nav-item" data-nav="categories">
        <span class="nav-icon">📚</span>
        <span class="nav-label">Topics</span>
      </button>
      <button class="nav-item" data-nav="flashcards">
        <span class="nav-icon">🃏</span>
        <span class="nav-label">Cards</span>
      </button>
      <button class="nav-item" data-nav="quiz">
        <span class="nav-icon">✅</span>
        <span class="nav-label">Quiz</span>
      </button>
    </nav>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
